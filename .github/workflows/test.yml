name: Test

on: ['push']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (vitest browser-mode, Firefox)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.9
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install

      # No node_modules/.vite cache here: the optimized-deps content depends on
      # the source import graph (optimizeDeps.entries crawl), which lockfile- or
      # config-based keys cannot capture. A stale restored cache passes Vite's
      # own validity check and then re-optimizes mid-run when tests import a
      # subpath the cache doesn't cover, breaking in-flight dynamic imports.
      # Cold-start is safe: the entries crawl pre-bundles the full graph before
      # tests run (verified in #5565).

      - name: Run Unit Tests
        run: pnpm vitest run --project=unit-tests --shard=${{ matrix.shard }}/${{ matrix.total }} --coverage --coverage.thresholds.100=false --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: coverage/coverage-final.json

  # ---------------------------------------------------------------------------
  # Storybook component tests (vitest browser-mode, Firefox)
  # ---------------------------------------------------------------------------
  storybook-tests:
    name: Storybook Tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.9
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install

      # No node_modules/.vite cache — see the unit-tests job for why a stale
      # optimize cache is unsafe and cold-start is not.

      - name: Run Storybook Tests
        run: pnpm vitest run --project=storybook-tests --shard=${{ matrix.shard }}/${{ matrix.total }} --coverage --coverage.thresholds.100=false --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-storybook-${{ matrix.shard }}
          path: coverage/coverage-final.json

      - name: Upload Accessibility Report
        id: artifact-upload-step
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: ./storybook/artifacts/accessibilityReport.html
          overwrite: 'true'

  # ---------------------------------------------------------------------------
  # Docs build-script tests (vitest node-mode) — fast, no browser/Playwright.
  # Covers the registry builders under docs/scripts/ (e.g. build-examples.mjs),
  # which the browser-mode unit/storybook projects exclude.
  # ---------------------------------------------------------------------------
  docs-script-tests:
    name: Docs Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.9
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Run docs build-script tests
        run: pnpm --filter @marigold/docs test

  # ---------------------------------------------------------------------------
  # Merge coverage & report
  # ---------------------------------------------------------------------------
  coverage-report:
    name: Coverage Report
    needs: [unit-tests, storybook-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CI: true
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      # Download coverage artifacts from all shards. Each shard lands in its
      # own subdirectory (e.g. coverage/unit/coverage-unit-1/coverage-final.json)
      # so filenames don't collide.
      - name: Download unit test coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-unit-*
          path: coverage/unit
      - name: Download storybook test coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-storybook-*
          path: coverage/storybook

      # Merge Istanbul coverage JSONs from every shard
      - name: Merge coverage reports
        run: |
          mkdir -p .nyc_output
          i=0
          for f in coverage/unit/*/coverage-final.json coverage/storybook/*/coverage-final.json; do
            [ -f "$f" ] || continue
            cp "$f" ".nyc_output/cov-$i.json"
            i=$((i+1))
          done
          # Generate merged reports in all required formats
          npx nyc report --temp-dir .nyc_output --report-dir coverage -r text -r json -r html -r json-summary
          # Enforce coverage thresholds on the merged result
          npx nyc check-coverage --temp-dir .nyc_output --statements 90 --branches 85 --functions 90 --lines 90

      # Post accessibility report link
      - name: Get PR number
        uses: jwalton/gh-find-current-pr@master
        id: findPr
        with:
          state: open
      - name: Accessibility Report Preview
        if: success() && steps.findPr.outputs.number
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.findPr.outputs.number }}
          message: |
            Accessibility tests executed. Download the report [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      # Coverage report PR comment
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Marigold Code Coverage'
          pr-number: 'auto'
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
