name: Renovate

on:
  schedule:
    # Monday and Thursday at 00:00 UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch:
  issues:
    types: [edited]

concurrency:
  # A run the `if` will skip gets its own group, so it cannot take the single
  # pending slot from a tick queued behind a run in flight. The condition has to
  # mirror the job's `if` exactly, or a skipped run still lands in `shared`.
  group: >-
    renovate-${{ (github.event_name == 'issues' && (github.event.issue.title !=
    'Dependency Dashboard' || github.event.sender.type == 'Bot')) &&
    github.run_id || 'shared' }}
  cancel-in-progress: false

jobs:
  renovate:
    # Renovate's own dashboard write is an issue edit, so a run would trigger another.
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: renovatebot/github-action@v46.3.1
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
