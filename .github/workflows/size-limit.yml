name: Size Limit

on:
  push:
    # Skip pushes that can't affect the bundle (mirrors build.yml). The check
    # stays push-triggered to match its sibling CI checks (lint/test/typecheck).
    paths-ignore:
      - '.changeset/**'
      - '.github/**'
      - 'docs/**'

concurrency:
  # On a branch a new push makes the old run moot, so cancel it. On main every
  # merge is its own commit that needs a verdict, so each gets its own group.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  size-limit:
    name: Size Limit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: true
    steps:
      # Setup
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0 # Uses version from package.json#packageManager
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build

      # Action — fails when any component exceeds its budget in .size-limit.json
      - name: Check bundle size
        run: pnpm --filter @marigold/components size
