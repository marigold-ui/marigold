name: Format

on: ['push']

concurrency:
  # On a branch a new push makes the old run moot, so cancel it. On main every
  # merge is its own commit that needs a verdict, so each gets its own group.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      # Setup
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0 # Uses version from package.json#packageManager
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      # Action
      # No build step, unlike Lint and Typecheck: Prettier only needs its own
      # plugins and the shared @marigold/prettier-config, not the built packages.
      #
      # This guards against a Prettier version bump landing without the repo-wide
      # reformat it implies. Without it, the drift is invisible until someone runs
      # `pnpm format` and finds unrelated churn in their branch (see DST-1690).
      - name: Check formatting
        run: pnpm format:check
