name: Prose

# On push, like Lint and Format. A `pull_request`-only trigger drops the synchronize event
# for a second commit and the check silently does not run — a stale green check is
# indistinguishable from a fresh one (see the same note in validate-links.yml).
#
# Deliberately unfiltered by path: `vale .` over the whole repo takes 0.2s, so there is
# nothing to save, and a path filter on a required check means a PR that misses the filter
# waits forever for a check that will never run.
on: ['push']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: Check prose style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.9 # Uses version from package.json#packageManager
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      # Runs `pnpm lint:prose` rather than re-spelling it, so the local command and the CI
      # check cannot drift. No `pnpm install` and no build, like theme-conventions.yml and
      # memory-store.yml: the script downloads the pinned binary itself, and neither it nor
      # Vale needs anything from node_modules.
      - name: Check prose style
        run: pnpm lint:prose
