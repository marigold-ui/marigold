name: Prose

on: ['push']

concurrency:
  # On a branch a new push makes the old run moot, so cancel it. On main every
  # merge is its own commit that needs a verdict, so each gets its own group.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prose:
    name: Check prose style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Check prose style (Vale is pinned in the script, checksum verified)
        run: node scripts/vale.mjs .
