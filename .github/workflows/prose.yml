name: Prose

on:
  push:
    # changesets/action creates this branch at main's SHA, then pushes the
    # version bump onto it seconds later. That second push cancelled the first
    # run, whose checks belong to main's commit. The release PR's own branch
    # (changeset-release/main) still runs everything.
    branches-ignore:
      - 'changesets-ghcommit-temp/**'

concurrency:
  # On a branch a new push makes the old run moot, so cancel it. On main every
  # merge is its own commit that needs a verdict, so each gets its own group.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prose:
    name: Check prose style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node (using .node-version)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Check prose style (Vale is pinned in the script, checksum verified)
        run: node scripts/vale.mjs .
