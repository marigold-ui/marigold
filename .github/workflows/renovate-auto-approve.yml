name: Renovate auto-approve

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'marigold-renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/') &&
      contains(github.event.pull_request.body, '**Automerge**: Enabled')
    runs-on: ubuntu-latest
    steps:
      # No owner or repositories, so the token is scoped to this repo alone.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}

      # Renovate rebases often, and a push does not dismiss approvals here.
      - name: Approve unless already approved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.state == "APPROVED") | .id' | wc -l)

          if [ "$existing" -gt 0 ]; then
            echo "Already approved, nothing to do."
            exit 0
          fi

          gh pr review "$PR" --repo "$REPO" --approve \
            --body 'Renovate marked this update automergeable, approving so auto-merge can complete it.'
