name: Renovate auto-approve

# main requires one approving review, and GitHub's auto-merge does not use the
# Renovate app's bypass allowance, so a green PR waits for a human. An approval
# from github-actions[bot] satisfies the rule and lets auto-merge finish the job.
# Renovate cannot approve its own PR, which is why this runs as a second identity.
# Which updates qualify stays in renovate.json: Renovate writes that verdict into
# the PR body, and the job reads it, so a major still needs a human.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'marigold-renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/') &&
      contains(github.event.pull_request.body, '**Automerge**: Enabled')
    runs-on: ubuntu-latest
    steps:
      # Approvals survive a push here (dismiss_stale_reviews is off), so the
      # rebases Renovate does would otherwise stack a review each time. A
      # dismissed review reports its own state, so this counts live ones only.
      - name: Approve unless already approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.state == "APPROVED") | .id' | wc -l)

          if [ "$existing" -gt 0 ]; then
            echo "Already approved, nothing to do."
            exit 0
          fi

          gh pr review "$PR" --repo "$REPO" --approve \
            --body 'Renovate marked this update automergeable, approving so auto-merge can complete it.'
