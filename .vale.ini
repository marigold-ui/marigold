# Prose style as lint (DST-1526). The rules live in `.vale/styles/Marigold/`; the writing
# guidance and the reasoning behind this scope are in CLAUDE.md under "Prose Style".
#
# Every path section below is matched against the path Vale is handed, relative to where it
# runs — so `pnpm lint:prose` runs `vale .` from the repo root, and the pre-commit hook passes
# `--relative`. An absolute path matches no section at all and is silently linted with no
# rules, which looks exactly like a clean file.
StylesPath = .vale/styles

# Print everything, including advisory rules. Vale's exit code is driven by `error` alerts
# only, so a `warning` rule is visible in CI without blocking a merge. New style rules land
# at `warning`, get cleaned up, then get promoted to `error`.
MinAlertLevel = suggestion

# ---------------------------------------------------------------------------------------
# In scope: prose written for a reader.
# ---------------------------------------------------------------------------------------

[docs/content/**/*.mdx]
BasedOnStyles = Marigold

# Changeset bodies become the release notes on the docs site, so they are reader-facing prose
# and are linted at the source rather than in the generated output.
[.changeset/*.md]
BasedOnStyles = Marigold

[{README.md,contributing.md,CODE-OF-CONDUCT.md,MIGRATION-v18.md}]
BasedOnStyles = Marigold

# Package READMEs ship to npmjs.com.
[{packages,themes,config}/*/README.md]
BasedOnStyles = Marigold

# ---------------------------------------------------------------------------------------
# Out of scope. Each section below needs an *empty* `BasedOnStyles`; `= NONE` is a fatal
# error, because Vale looks for a style literally named "NONE" on the StylesPath.
# ---------------------------------------------------------------------------------------

# Generated from changesets by `docs/scripts/build-changelog.mjs`, and untracked. The prose
# is guarded in `.changeset/*.md` instead, where a human writes it.
[docs/content/releases/**/release.mdx]
BasedOnStyles =

# Internal engineering notes, never published: `@marigold/cli` ships `files: ["dist"]`.
# This section exists because a path-section `*` spans `/`, so the published-README section
# above also matches `packages/cli/src/lib/validate/README.md`.
[packages/*/src/**]
BasedOnStyles =
