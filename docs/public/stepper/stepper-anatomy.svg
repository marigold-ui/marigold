<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="700"
   height="230"
   viewBox="0 0 700 230"
   fill="none"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(60,85)">
    <!-- Component UI -->

    <!-- Connector 1: completed, so it carries the done colour -->
    <line x1="98" y1="0" x2="146" y2="0" stroke="#16a34a" stroke-width="2" />
    <!-- Connector 2 -->
    <line x1="247" y1="0" x2="295" y2="0" stroke="#d1d5db" stroke-width="2" />
    <!-- Connector 3 -->
    <line x1="401" y1="0" x2="449" y2="0" stroke="#d1d5db" stroke-width="2" />

    <!-- Step 1: completed -->
    <circle cx="16" cy="0" r="16" fill="#16a34a" />
    <path
       d="M 9,0 L 13.5,4.5 L 23,-5"
       stroke="#ffffff"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none" />
    <text
       x="40"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       fill="#374151">Contact</text>

    <!-- Step 2: current -->
    <circle cx="162" cy="0" r="16" fill="#374151" />
    <text
       x="162"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       font-weight="600"
       fill="#ffffff"
       text-anchor="middle">2</text>
    <text
       x="186"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       font-weight="600"
       fill="#374151">Delivery</text>

    <!-- Step 3: error -->
    <circle cx="311" cy="0" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
    <path
       d="M 311,-7 L 318,5 L 304,5 Z"
       stroke="#dc2626"
       stroke-width="1.5"
       stroke-linejoin="round"
       fill="none" />
    <line x1="311" y1="-2" x2="311" y2="1" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="311" cy="3.2" r="0.9" fill="#dc2626" />
    <text
       x="335"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       fill="#dc2626">Payment</text>

    <!-- Step 4: upcoming -->
    <circle cx="465" cy="0" r="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
    <text
       x="465"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       fill="#6b7280"
       text-anchor="middle">4</text>
    <text
       x="489"
       y="4.5"
       font-family="sans-serif"
       font-size="13px"
       fill="#6b7280">Review</text>

    <!-- Step bounding box -->
    <rect
       x="-8"
       y="-24"
       width="104"
       height="48"
       rx="6"
       fill="none"
       stroke="#9ca3af"
       stroke-width="1"
       stroke-dasharray="4, 3" />

    <!-- Connector lines -->
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="2, 2">
      <!-- MARKER -->
      <path d="M 162,16 V 56" />
      <!-- CONNECTOR -->
      <path d="M 271,0 V 56" />
      <!-- STEP -->
      <path d="M 45,24 V 92" />
      <!-- LABEL -->
      <path d="M 212,10 V 92" />
    </g>

    <!-- Labels -->
    <g font-family="monospace" font-size="11px" fill="#6b7280" letter-spacing="0.05em" text-anchor="middle">
      <text x="162" y="68">MARKER</text>
      <text x="271" y="68">CONNECTOR</text>
      <text x="45" y="104">STEP</text>
      <text x="212" y="104">LABEL</text>
    </g>

    <!-- Dots -->
    <g fill="#9ca3af">
      <circle cx="162" cy="16" r="2.5" />
      <circle cx="271" cy="0" r="2.5" />
      <circle cx="45" cy="24" r="2.5" />
      <circle cx="212" cy="10" r="2.5" />
    </g>
  </g>
</svg>
