title: Multi-section event form
brief: >-
  A long event-creation form broken into composable Panel size="form" sections
  (event details, location and capacity, organizer info, co-organizers,
  registration settings). Demonstrates advanced settings in Panel.Collapsible,
  Inline/Stack field layout, and master/admin markers as a Panel variant and as
  Badge label addons, all inside a single Form.
patterns:
  - user-input/forms
mock_data:
  - alias: '@/lib/data/eventTypes'
    shape: |
      // Options for the event type Select. Swap for the consumer's data source.
      export const eventTypes: ReadonlyArray<{
        id: string;
        label: string;
        description: string;
      }>;
key_files:
  - eventDetails.tsx
  - locationSettings.tsx
  - organizerInfo.tsx
  - coOrganizers.tsx
  - registrationSettings.tsx
scaffolding_files:
  - page.tsx
peer_deps: []
