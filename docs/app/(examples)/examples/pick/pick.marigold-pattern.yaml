title: Pick records from a collection into a report
brief: >-
  A quarterly venue report that owns the venues picked for it. The empty
  report offers "Add venues" inside its EmptyState; once filled, the Venues
  panel header carries the count and total capacity and an "Edit venues"
  trigger. The trigger opens a fullscreen Dialog with a search field, three
  filter facets (type, city, availability) whose options show how many venues
  each leaves, a running "Showing n of 50 venues" count, and a compact
  seven-column multi-select Table with a pinned name column in a bounded,
  sticky Scrollable region. Selected venues stay visible as a removable
  Tag.Group rail ("Selected (n)") through every search and filter, so
  narrowing the list never drops a pick. The commit reads "Add 4 venues" on
  the first pick and "Update venues" when editing, and refuses an empty set
  with a message instead of a disabled button. The report shows its own
  table (upcoming events, availability, day rate) with a totals footer and a
  per-row remove button. Venue figures are raw numbers formatted with
  NumericFormat at render.
patterns:
  - user-input/pick
mock_data:
  - alias: '@/lib/data/venues'
    shape: |
      // Replace with the consumer's own data source. `type` indexes into
      // `venueTypes`; `price.from` is the lowest day rate in EUR.
      export const venueTypes: readonly string[];
      export const venues: Array<{
        id: string;
        name: string;
        type: number;
        city: string;
        country: string;
        capacity: number;
        price: { from: number; to: number };
        /** Average guest rating, 1 to 5. */
        rating: number;
      }>;
key_files:
  - PickVenuesDialog.tsx
  - ReportVenues.tsx
  - venues.ts
scaffolding_files:
  - page.tsx
peer_deps:
  - '@internationalized/date'
  - '@marigold/icons'
  - '@react-types/shared'
